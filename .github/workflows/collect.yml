name: EGX Daily Investor Collection

on:
  schedule:
    - cron: '30 14 * * 0-4'
    - cron: '30 15 * * 0-4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install requirements
        run: pip install -r requirements.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Test extraction now (manual; no Excel changes)
        if: github.event_name == 'workflow_dispatch'
        run: python collector.py --diagnostic

      - name: Collect scheduled session
        if: github.event_name == 'schedule'
        run: |
          LOCAL_TIME=$(TZ=Africa/Cairo date +%H:%M)
          echo "Cairo time: $LOCAL_TIME"
          case "$LOCAL_TIME" in
            17:*) python collector.py --date "$(TZ=Africa/Cairo date +%Y-%m-%d)" ;;
            *) echo "Outside scheduled collection hour; skip" ;;
          esac

      - name: Commit updated CSV and Excel
        if: github.event_name == 'schedule' && success()
        run: |
          git config user.name 'egx-collector-bot'
          git config user.email 'egx-collector-bot@users.noreply.github.com'
          git add data/investor_flows.csv data/investor_flows.xlsx || true
          if git diff --cached --quiet; then
            echo 'No new data'
          else
            git commit -m 'Update daily investor flows'
            git push
          fi

      - name: Upload diagnostics (manual tests and errors)
        if: always() && (github.event_name == 'workflow_dispatch' || failure())
        uses: actions/upload-artifact@v4
        with:
          name: egx-diagnostics
          path: diagnostics/
          if-no-files-found: ignore
