
name: EGX Daily Investor Collection

on:
  schedule:
    # Cairo: 17:30 EEST = 14:30 UTC
    # Cairo: 17:30 EET = 15:30 UTC
    - cron: '30 14 * * 0-4'
    - cron: '30 15 * * 0-4'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Collect EGX investor data
        env:
          TZ: Africa/Cairo
          EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "Event: $EVENT_NAME"
          echo "Cairo time: $(TZ=Africa/Cairo date)"

          if [ "$EVENT_NAME" = "schedule" ]; then
            LOCAL_TIME=$(TZ=Africa/Cairo date +%H:%M)
            case "$LOCAL_TIME" in
              17:*)
                echo "Scheduled collection permitted"
                ;;
              *)
                echo "Outside scheduled collection hour: $LOCAL_TIME"
                exit 0
                ;;
            esac
          else
            echo "Manual run: bypassing time restriction"
          fi

          python collector.py --date "$(TZ=Africa/Cairo date +%Y-%m-%d)"

      - name: Commit updated CSV and Excel
        run: |
          git config user.name 'egx-collector-bot'
          git config user.email 'egx-collector-bot@users.noreply.github.com'

          git add data/investor_flows.csv data/investor_flows.xlsx || true

          if git diff --cached --quiet; then
            echo "No new data"
          else
            git commit -m 'Update daily investor flows'
            git push
          fi

      - name: Upload diagnostics on error
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: egx-diagnostics
          path: diagnostics/
          if-no-files-found: ignore
